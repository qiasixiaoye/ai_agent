spring:
  application:
    name: your-app
  profiles:
    active: local
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    dashscope:
      api-key: xxxx
      chat:
        options:
          model: "you model name"
          stream: true
    mcp:
      client:
        sse:
          connections:
            server1:
              url: "mcp_url"
        enabled: true
#        stdio:
#          servers-configuration: classpath:mcp-servers.json

  datasource:
    url: "Pgvector_url" # 支持向量插件的pg数据库
    username: username
    password: password
server:
  port: 8081
  # context-path 已停用：改由 ApiPathPrefixConfig 仅对本项目 controller 加 /api 前缀，
  # 以免 Spring AI MCP server 的 /sse、/mcp/message 被 context-path 影响导致 Dify 握手错位。
  # servlet:
  #   context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.vs.vsaiagent
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn

# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG

search-api:
  api-key: xxxx

image-api:
  api-key: xxxx

app:
  # dashscope: use Spring AI Alibaba DashScope auto-configuration
  # deepseek: use OpenAI-compatible config below
  llm:
    provider: dashscope
  dify:
    base-url:             # 运行 workflow 用，官方 compose 部署后为 http://localhost:3001
    api-key:              # Dify 应用的 app-xxx key
    default-workflow-id:
    timeout-ms: 60000
    console:              # DSL 自动导入用（workflow-builder /import 接口）
      base-url:           # 同上，如 http://localhost:3001
      email:              # Dify 控制台登录邮箱
      password:
      access-token:       # 可选：直接填 console token 则跳过 email/password 登录
  kb:
    dashscope:
      index: assistant_kb
  memory:
    # Persistent four-tier memory store. Keep this outside classpath resources.
    base-dir: ${user.dir}/tmp/agent-memory
    working-message-limit: 20
    summary-max-chars: 4000
    tier-item-limit: 100
  context:
    # The model window is partitioned explicitly; output and safety are never available to input context.
    window-tokens: 32768
    output-reserve-tokens: 4096
    safety-margin-tokens: 2048
    history-token-budget: 5000
    summary-token-budget: 1500
    semantic-token-budget: 1000
    episodic-token-budget: 1000
    rag-token-budget: 5000
    skill-token-budget: 3500
    skill-per-item-token-budget: 2000
    tool-schema-token-budget: 2000
    tool-result-token-budget: 3500
    # Compatibility budget used by the manual memory preview endpoint.
    memory-token-budget: 2500
    semantic-top-k: 5
    episodic-top-k: 3
  mcp:
    catalog-ttl-ms: 30000
    tool-timeout-ms: 15000
    policy:
      allow:
      deny: terminal,shell,execute_command,run_command
      high-risk: delete,remove,write,send,publish,payment,deploy
    circuit:
      failure-threshold: 3
      reset-ms: 60000

# Optional OpenAI-compatible model config, used when app.llm.provider=deepseek.
# spring:
#   ai:
#     openai:
#       api-key: xxxx
#       base-url: https://api.deepseek.com
#       chat:
#         options:
#           model: deepseek-chat
